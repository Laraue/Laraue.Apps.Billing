# Scrape config for Billing's three hosts - merge into the `scrape_configs` of prometheus.yml.
# Every host exports /_metrics; the gRPC host serves it on its own HTTP/1.1 health port
# (Kestrel:HealthPort, 5264 by default), not on the gRPC port. Adjust the targets to the deployment.
scrape_configs:
  - job_name: billing-web-api
    metrics_path: /_metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["billing-web-api:8080"]

  - job_name: billing-internal-api
    metrics_path: /_metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["billing-internal-api:5264"]

  # The only host that publishes the database gauges (billing_subscriptions_active, billing_payments_pending*).
  - job_name: billing-worker
    metrics_path: /_metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["billing-worker:8080"]
