syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Laraue.Apps.Billing.Internal.Contracts";
package laraue.apps.billing.internal.v1;

// Service-to-service contract other Laraue apps call directly to get a user/organization's active
// subscription and its limits (tariffs differ per calling service - see
// LaraueBoardsPersonalSubscription/LaraueBoardsTeamSubscription/MarkdownTranslatorSubscription).
// There's no "no active subscription" outcome to handle - a paid entity with none yet is
// auto-provisioned onto the service's Free tariff on first call, so both rpcs below always return
// a real subscription (or INVALID_ARGUMENT for an unsupported ServiceId/personal-vs-organization
// combination, e.g. MarkdownTranslator has no team tariffs).
service SubscriptionService {
  rpc GetActivePersonalSubscription (GetActivePersonalSubscriptionRequest) returns (ActiveSubscriptionResponse);
  rpc GetActiveOrganizationSubscription (GetActiveOrganizationSubscriptionRequest) returns (ActiveSubscriptionResponse);
  rpc GetPersonalTariffName (GetActivePersonalSubscriptionRequest) returns (TariffNameResponse);
  rpc GetOrganizationTariffName (GetActiveOrganizationSubscriptionRequest) returns (TariffNameResponse);
}

enum ServiceId {
  SERVICE_ID_UNSPECIFIED = 0;
  SERVICE_ID_LARAUE_BOARDS = 1;
  SERVICE_ID_MARKDOWN_TRANSLATOR = 2;
}

message GetActivePersonalSubscriptionRequest {
  ServiceId service_id = 1;
  string user_id = 2;
}

message GetActiveOrganizationSubscriptionRequest {
  ServiceId service_id = 1;
  string organization_id = 2;
}

message ActiveSubscriptionResponse {
  string code = 1;

  // The start of the period the plan's limits (e.g. issues per month) are counted in: the rolling month
  // of a Free plan (it starts when the plan is provisioned and is renewed by the first use after it
  // is over), the calendar month of a paid plan.
  google.protobuf.Timestamp limit_period_started_at = 5;
  // When the current period of the plan ends. Not set when it has no end. period_resets says what
  // happens then: the allowance starts over (a Free plan) or the plan ends (a paid one).
  google.protobuf.Timestamp period_ends_at = 6;
  bool period_resets = 7;

  oneof payload {
    LaraueBoardsPersonalSubscription laraue_boards_personal = 2;
    LaraueBoardsTeamSubscription laraue_boards_team = 3;
    MarkdownTranslatorSubscription markdown_translator = 4;
  }
}

message LaraueBoardsPersonalSubscription {
  optional int32 limit_issues_per_month = 1;
  optional int32 limit_free_team_organizations_count = 2;
  int64 included_tokens_count = 3;
}

message LaraueBoardsTeamSubscription {
  optional int32 limit_issues_per_month = 1;
  int64 included_tokens_count = 2;
}

message MarkdownTranslatorSubscription {
  int64 included_daily_free_tokens_count = 1;
}

message TariffNameResponse {
  string name = 1;
}
