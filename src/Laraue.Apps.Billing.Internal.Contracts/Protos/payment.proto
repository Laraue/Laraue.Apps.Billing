syntax = "proto3";

option csharp_namespace = "Laraue.Apps.Billing.Internal.Contracts";
package laraue.apps.billing.internal.v1;

// Service-to-service contract for starting a payment. The caller names what the customer buys and
// gets back the address to send them to; which payment provider is behind it is Billing's business
// and never appears here. The price is always Billing's own, the caller cannot set an amount.
// Whether the payment succeeded is learned by the caller the usual way - the subscription and
// token balance rpcs - since the provider reports it to Billing, not to the caller.
//
// Split into personal/organization rpcs for the same reason as subscription.proto: this service has
// no User/Organization tables of its own and cannot otherwise tell which kind of tariff is meant.
// Which service is calling is identified by the "x-laraue-service-id" metadata header, as in
// token.proto. An unknown item, or one that is not for sale to that kind of payer, is
// INVALID_ARGUMENT.
service PaymentService {
  rpc CreatePersonalCheckout (CreatePersonalCheckoutRequest) returns (CreateCheckoutResponse);
  rpc CreateOrganizationCheckout (CreateOrganizationCheckoutRequest) returns (CreateCheckoutResponse);
}

enum PaymentItemKind {
  PAYMENT_ITEM_KIND_UNSPECIFIED = 0;
  PAYMENT_ITEM_KIND_SUBSCRIPTION = 1;
  PAYMENT_ITEM_KIND_TOKEN_PACK = 2;
}

message CreatePersonalCheckoutRequest {
  // The user who pays and is covered by the purchase.
  string user_id = 1;
  PaymentItemKind kind = 2;
  // Tariff id for a subscription, token pack id for a token pack.
  string item_id = 3;
  // ISO 4217 code the customer pays in, e.g. "RUB".
  string currency_code = 4;
  // Where to return the customer after paying, when the provider supports it. Optional.
  string return_url = 5;
  // A storage add-on bought with the tariff, see StorageCheckout. Optional.
  StorageCheckout storage = 6;
}

message CreateOrganizationCheckoutRequest {
  // The organization covered by the purchase.
  string organization_id = 1;
  // The user who pays.
  string user_id = 2;
  PaymentItemKind kind = 3;
  string item_id = 4;
  string currency_code = 5;
  string return_url = 6;
  // A storage add-on bought with the tariff, see StorageCheckout. Optional.
  StorageCheckout storage = 7;
}

// Storage bought with a subscription. Only for PAYMENT_ITEM_KIND_SUBSCRIPTION of a paid tariff; with
// a token pack it is INVALID_ARGUMENT. The add-on is charged in the same payment as the tariff (one
// price: the tariff's plus the add-on's) and applies when the payment is fulfilled. The subscription
// keeps the add-on of its last payment, so paying without one removes it.
message StorageCheckout {
  // The add-on's id. Empty for no add-on.
  string addon_id = 1;
  // The caller's current storage usage of the covered user or organization. When set and above the
  // storage the tariff and add-on would give, no payment is created: the response has
  // storage_over_limit instead, so a customer can't move to less storage than they already use.
  optional int64 usage_bytes = 2;
}

message CreateCheckoutResponse {
  // Empty when storage_over_limit is set.
  string payment_id = 1;
  // The address to send the customer to in order to pay. Empty when storage_over_limit is set.
  string url = 2;
  // Set when nothing was created because the usage passed in StorageCheckout is above the storage
  // the tariff and add-on would give.
  StorageOverLimit storage_over_limit = 3;
}

message StorageOverLimit {
  int64 usage_bytes = 1;
  // The storage the tariff and add-on would give.
  int64 quota_bytes = 2;
}
